[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
# Plain `pytest` runs the mocked suite only. `pytest -m live` overrides this and
# runs ONLY the live tests (real Gemini + LlamaParse — costs real quota).
addopts = -m "not live"
markers =
    live: tests that make real external calls (API/Docker/network). Run deliberately, once, with -m live.
